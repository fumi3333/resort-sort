<html lang="ja">
<head>

  <style>

      --gov-muted: #4d4d4d;

      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--gov-card-bg);
      border: 1px solid var(--gov-border-light);
      border-top: 4px solid var(--gov-blue);
      padding: 16px 20px;
      border-radius: 4px;

      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gov-text);

    }
    .badge {

      color: var(--gov-blue);
      border: 1px solid #b3cdf2;
      padding: 2px 10px;
      border-radius: 2px;
      font-weight: 600;
    }
    .header-links a {
      color: var(--gov-blue);
      text-decoration: underline;
      font-size: 13px;
      font-weight: 600;
      margin-left: 16px;
    }
    .header-links a:hover {
      color: var(--gov-blue-hover);
      text-decoration: none;
    }

    /* 検索フィルターバー */
    .filter-card {
      background: var(--gov-card-bg);
      border: 1px solid var(--gov-border-light);
      border-radius: 4px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--gov-text);
    }
    .form-group input, .form-group select {
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid var(--gov-border);
      color: var(--gov-text);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: 2px solid var(--gov-blue);
      outline-offset: 1px;
      border-color: var(--gov-blue);
    }
    .quick-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
      padding-top: 4px;
      border-top: 1px dashed var(--gov-border-light);
    }
    .chip-label {
      color: var(--gov-muted);
      font-weight: 700;
      margin-right: 4px;
    }
    .chip {
      background: #ffffff;
      border: 1px solid var(--gov-border);
      color: var(--gov-text);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip:hover {
      background: var(--gov-blue-light);
      border-color: var(--gov-blue);
    }
    .chip.active {
      background: var(--gov-blue);
      color: #ffffff;
      border-color: var(--gov-blue);
      font-weight: 700;
    }

    .btn-csv {
      background: var(--gov-accent);
      color: #ffffff;
      border: 1px solid var(--gov-accent-hover);
      padding: 9px 18px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      white-space: nowrap;
    }
    .btn-csv:hover {
      background: var(--gov-accent-hover);
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--gov-muted);
      padding: 0 4px;
      font-weight: 600;
    }
    .highlight-count {
      color: var(--gov-blue);
      font-weight: 700;
      font-size: 16px;
    }

    /* テーブル */
    .table-container {
      background: var(--gov-card-bg);
      border: 1px solid var(--gov-border-light);
      border-radius: 4px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      background: #eaeef4;
      padding: 12px 14px;
      font-weight: 700;
      color: var(--gov-text);
      border-bottom: 2px solid var(--gov-border);
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--gov-border-light);
      color: var(--gov-text);
      vertical-align: middle;
    }
    tr:nth-child(even) td {
      background: #fafbfd;
    }
    tr:hover td {
      background: #edf3fa;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-sounding {
      background: var(--gov-warning-bg);
      color: var(--gov-warning-text);
      border: 1px solid var(--gov-warning-border);
    }
    .tag-land {
      font-weight: 700;
      color: #0b4c8c;
    }
    .link-btn {
      color: var(--gov-blue);
      text-decoration: underline;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .link-btn:hover {
      text-decoration: none;
      color: var(--gov-blue-hover);
    }
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: var(--gov-muted);
      font-size: 15px;

</head>

  <div class="container">
    <header>
      <div class="logo-area">

      </div>
    </header>

    <!-- 検索フィルター -->
    <div class="filter-card">
      <div class="filter-row">
        <div class="form-group">
          <label>キーワード検索（学校名・地名・施設名）</label>
          <input type="text" id="q-input" placeholder="例: 小学校, 中学校, 跡地, プール, 太陽光, 庁舎">
        </div>

        <div class="form-group">
          <label>都道府県</label>
          <select id="pref-select">
            <option value="">全国（すべて）</option>
            <!-- JSで47都道府県を自動生成 -->
          </select>
        </div>

        <div class="form-group">
          <label>土地面積（下限㎡）</label>
          <input type="number" id="min-land" placeholder="例: 3000" step="1000">
        </div>

        <div class="form-group">
          <label>用途地域</label>
          <select id="youto-select">
            <option value="">指定なし</option>
            <option value="非線引">非線引き区域</option>
            <option value="工業">工業・準工業</option>
            <option value="住居">住居系</option>
            <option value="商業">商業・近隣商業</option>
            <option value="調整">市街化調整区域</option>
            <option value="無指定">無指定</option>
          </select>
        </div>

        <div class="form-group">
          <label>種別・サウンディング</label>
          <select id="type-select">
            <option value="">すべて</option>
            <option value="sounding">サウンディング対話あり</option>
            <option value="has_land">土地面積の記載あり</option>
          </select>
        </div>

        <button class="btn-csv" id="btn-download-csv">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          絞込結果をCSV出力
        </button>
      </div>

      <!-- クイック絞り込みチップ -->
      <div class="quick-chips">
        <span class="chip-label">よく探される条件:</span>
        <button class="chip" onclick="setQuick('学校')"> 廃校・学校跡地</button>
        <button class="chip" onclick="setQuick('長野県', 5000, '非線引')"> 長野県・広大敷地・非線引</button>
        <button class="chip" onclick="setQuick('', 10000)"> 10,000㎡超（再エネ・インフラ）</button>
        <button class="chip" onclick="setQuick('', 5000, '工業')"> 5,000㎡超・工業・準工業（物流）</button>
        <button class="chip" onclick="setQuick('', 0, '', 'sounding')"> サウンディング対話（公募前）</button>
        <button class="chip" onclick="resetFilter()" style="color: #ef4444;"> 条件リセット</button>
      </div>
    </div>

    <!-- ステータスバー -->
    <div class="status-bar">
      <div>
        該当件数: <span class="highlight-count" id="match-count">読み込み中...</span>
        <span id="sub-count" style="margin-left: 8px; font-size: 12px;"></span>
      </div>
      <div>最終巡回同期: 2026-10-18 JST / 全国733自治体網羅</div>
    </div>

    <!-- 物件テーブル -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 110px;">都道府県</th>
            <th style="width: 140px;">自治体</th>
            <th>物件名 / 公募名</th>
            <th style="width: 120px;">土地面積(㎡)</th>
            <th style="width: 140px;">用途地域</th>
            <th style="width: 130px;">種別 / 対話</th>
            <th style="width: 100px;">元資料</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" class="loading-spinner">全国3,861件の公有地データを読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

    function renderTable(items) {
      currentFiltered = items;
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const count = items.length;
      document.getElementById('match-count').textContent = `${count.toLocaleString()} 件`;
      document.getElementById('sub-count').textContent = `（全 ${rawData.length.toLocaleString()} 件中）`;

      if (count === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--muted);">条件に合致する物件が見つかりませんでした。条件を広げてみてください。</td></tr>`;
        return;
      }

      // 初回表示は上位100件（スクロール負担軽減）
      const displayItems = items.slice(0, 100);
      const frag = document.createDocumentFragment();

      displayItems.forEach(it => {
        const tr = document.createElement('tr');
        
        let landStr = it.land ? Number(it.land).toLocaleString() : '<span style="color: #64748b;">記載なし</span>';
        let youtoStr = it.youto ? escapeHtml(it.youto) : '<span style="color: #64748b;">-</span>';
        let typeBadge = it.sounding ? '<span class="tag tag-sounding">サウンディング</span>' : '<span style="color: #64748b; font-size: 11px;">一般公募/売却</span>';
        let urlBtn = it.url ? `<a href="${escapeHtml(it.url)}" target="_blank" class="link-btn">自治体HP ↗</a>` : '-';

        tr.innerHTML = `
          <td><strong>${escapeHtml(it.pref || '-')}</strong></td>
          <td>${escapeHtml(it.muni || '-')}</td>
          <td><strong>${escapeHtml(it.title || '-')}</strong></td>
          <td class="tag-land">${landStr}</td>
          <td>${youtoStr}</td>
          <td>${typeBadge}</td>
          <td>${urlBtn}</td>
        `;
        frag.appendChild(tr);
      });

      tbody.appendChild(frag);

      if (count > 100) {
        const trNotice = document.createElement('tr');
        trNotice.innerHTML = `<td colspan="7" style="text-align: center; padding: 12px; color: var(--muted); background: #1e293b;">※ 表示パフォーマンス向上のため上位100件を表示中（全 ${count} 件は右上の「CSV出力」で全件ダウンロード可能）</td>`;
        tbody.appendChild(trNotice);
      }
    }

    function applyFilter() {
      const q = document.getElementById('q-input').value.trim().toLowerCase();
      const pref = document.getElementById('pref-select').value;
      const minLand = parseFloat(document.getElementById('min-land').value) || 0;
      const youto = document.getElementById('youto-select').value;
      const type = document.getElementById('type-select').value;

      const filtered = rawData.filter(d => {
        if (q) {
          const matchTitle = (d.title || '').toLowerCase().includes(q);
          const matchMuni = (d.muni || '').toLowerCase().includes(q);
          const matchPref = (d.pref || '').toLowerCase().includes(q);
          if (!matchTitle && !matchMuni && !matchPref) return false;
        }
        if (pref && d.pref !== pref) return false;
        if (minLand && (!d.land || d.land < minLand)) return false;
        if (youto && !(d.youto || '').includes(youto)) return false;
        if (type === 'sounding' && !d.sounding) return false;
        if (type === 'has_land' && !d.land) return false;
        return true;
      });

      renderTable(filtered);
    }

    function setQuick(q = '', land = 0, youto = '', type = '') {
      document.getElementById('q-input').value = q;
      document.getElementById('min-land').value = land || '';
      document.getElementById('youto-select').value = youto;
      document.getElementById('type-select').value = type;
      if (q === '長野県') {
        document.getElementById('pref-select').value = '長野県';
        document.getElementById('q-input').value = '';
      }
      applyFilter();
    }

    function resetFilter() {
      document.getElementById('q-input').value = '';
      document.getElementById('pref-select').value = '';
      document.getElementById('min-land').value = '';
      document.getElementById('youto-select').value = '';
      document.getElementById('type-select').value = '';
      applyFilter();
    }

    document.getElementById('q-input').addEventListener('input', applyFilter);
    document.getElementById('pref-select').addEventListener('change', applyFilter);
    document.getElementById('min-land').addEventListener('input', applyFilter);
    document.getElementById('youto-select').addEventListener('change', applyFilter);
    document.getElementById('type-select').addEventListener('change', applyFilter);

        const landVal = r.land || '';
        const youtoVal = (r.youto || '').replace(/"/g, '""');
        const isSnd = r.sounding ? 'サウンディング対話あり' : '公募/売却';
        csv += `"${r.pref}","${r.muni}","${titleClean}","${landVal}","${youtoVal}","${isSnd}","${r.url}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `全国公有地・廃校抽出リスト_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      alert(`【CSVダウンロード完了】\n現在絞り込まれた ${currentFiltered.length} 件の物件データをCSV出力しました。`);
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
  </script>
</body>
</html>
